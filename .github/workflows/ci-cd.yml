name: CI/CD Pipeline ProductCatalog API

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  unit-tests:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      - name: Run Unit Tests
        run: >
          dotnet test tests/ProductCatalog.Tests/ProductCatalog.Tests.csproj
          --filter "FullyQualifiedName~ProductUnitTests"
          --configuration Release
          --no-build
          --logger "console;verbosity=detailed"
          --logger "trx;LogFileName=UnitResults.trx"
          --results-directory ./TestResults/UnitTests

      - name: Upload Unit Tests Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: ./TestResults/UnitTests/**/*.trx

      - name: Publish Unit Test Summary
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: 'Unit Tests Report'
          path: './TestResults/UnitTests/**/*.trx'
          reporter: 'dotnet-trx'
          fail-on-empty: false

  integration-tests:
    name: Integration Tests (SQL Server)
    runs-on: ubuntu-latest
    needs: [unit-tests]
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        ports:
          - 1433:1433
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Password123!"
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Password123!' -C -Q 'SELECT 1'"
          --health-interval 15s
          --health-timeout 5s
          --health-retries 6
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      - name: Run Integration Tests
        env:
          ConnectionStrings__CatalogDbConnection: "Server=localhost,1433;Database=CatalogDB_Test;User Id=sa;Password=Password123!;TrustServerCertificate=True;MultipleActiveResultSets=True"
        run: >
          dotnet test tests/ProductCatalog.Tests/ProductCatalog.Tests.csproj
          --filter "FullyQualifiedName~ProductIntegrationTests"
          --configuration Release
          --no-build
          --logger "console;verbosity=detailed"
          --logger "trx;LogFileName=IntegrationResults.trx"
          --results-directory ./TestResults/IntegrationTests

      - name: Upload Integration Tests TRX
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: ./TestResults/IntegrationTests/**/*.trx

      - name: Publish Integration Test Summary
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: 'Integration Tests Report'
          path: './TestResults/IntegrationTests/**/*.trx'
          reporter: 'dotnet-trx'
          fail-on-empty: false

  build-and-push-docker:
    name: Build & Push Docker Image
    needs: [integration-tests]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/productcatalog-api
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}